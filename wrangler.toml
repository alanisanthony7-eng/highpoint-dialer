# Cloudflare Pages project for the Highpoint desk + dialer
name = "highpoint-dialer"
pages_build_output_dir = "public"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

# Create a D1 database called "highpoint" in Cloudflare, then either bind it in
# Pages → Settings → Bindings (variable name DB), or paste its id below.
[[d1_databases]]
binding = "DB"
database_name = "highpoint"
database_id = "5dceed87-da4e-4420-8940-78ec50647f4b"

# Non-secret settings (secrets like TWILIO_AUTH_TOKEN and HP_INVITE_CODE go in
# Pages → Settings → Variables and secrets, type "Secret")
[vars]
HP_ADMIN_EMAILS = "alanisanthony7@gmail.com"
HP_PUBLIC_URL = "https://highpoint-dialer.pages.dev"
# Snap Login Kit public OAuth client ID (turns on "Use my Bitmoji"). Not a secret.
HP_SNAP_CLIENT_ID = ""
