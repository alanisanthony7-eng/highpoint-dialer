<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Your quote · Highpoint Financial</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Libre+Caslon+Text:wght@400;700&display=swap">
<style>
:root{--bg:#f4f6fa;--card:#fff;--ink:#0f1a2e;--muted:#566176;--line:#dde3ec;--accent:#22427f;--accent-2:#2f5296;--accent-soft:#e8eef9;--r:14px;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#070b14;--card:#0e1524;--ink:#eef2f8;--muted:#9aa5b8;--line:#223047;--accent:#8fb0ec;--accent-2:#3a5f9f;--accent-soft:#16223a;color-scheme:dark}}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:17px/1.55 "IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh}
.wrap{max-width:560px;margin:0 auto;padding:28px 16px 60px}
.brand{font:700 12px/1 "IBM Plex Sans",sans-serif;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);margin:0 0 18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:24px;box-shadow:0 10px 30px -18px rgba(15,26,46,.35)}
h1{font:700 clamp(24px,5vw,32px)/1.2 "Libre Caslon Text",Georgia,serif;margin:0 0 8px;letter-spacing:-.005em}
.who{color:var(--muted);margin:0 0 18px}
.price{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin:6px 0 4px}
.price b{font:700 clamp(36px,8vw,48px)/1 "IBM Plex Sans",sans-serif;letter-spacing:-.03em}
.price span{color:var(--muted);font-weight:600}
.rows{display:grid;gap:10px;margin:18px 0;padding:14px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.rows div{display:flex;justify-content:space-between;gap:12px}
.rows span{color:var(--muted)}
.rows b{text-align:right}
.note{font-size:14px;color:var(--muted);margin:0 0 18px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:54px;padding:12px 22px;border:0;border-radius:12px;background:var(--accent-2);color:#fff;font:700 17px "IBM Plex Sans",sans-serif;cursor:pointer;text-decoration:none}
.btn.wide{width:100%}
.foot{margin-top:18px;font-size:13px;color:var(--muted);text-align:center}
.err{color:#b3261e;font-weight:600}
</style>
</head>
<body>
<div class="wrap">
  <p class="brand" id="company">Highpoint Financial</p>
  <div class="card" id="main"><p>Loading…</p></div>
  <p class="foot">Your information is only shared with your agent. <a href="/privacy.html" style="color:inherit">Privacy</a></p>
</div>
<script>
(() => {
  "use strict";
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const money = (n) => isFinite(+n) ? "$" + Number(n).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) : "—";
  const token = (location.pathname.match(/^\/q\/([A-Za-z0-9_-]+)/)?.[1] || new URLSearchParams(location.search).get("t") || "").trim();
  const main = document.getElementById("main");
  (async () => {
    if (!token) { main.innerHTML = `<h1>Quote not found</h1><p class="err">This link is missing a quote.</p>`; return; }
    let D;
    try {
      const r = await fetch("/api/quote/p/" + encodeURIComponent(token));
      D = await r.json();
      if (!r.ok) throw new Error(D.error || "Quote not found");
    } catch (e) { main.innerHTML = `<h1>Quote not found</h1><p class="err">${esc(e.message)}</p>`; return; }
    document.getElementById("company").textContent = D.company;
    document.title = `Your quote · ${D.company}`;
    const q = D.quote || {};
    main.innerHTML = `<h1>Your quote</h1>
      <p class="who">${esc(D.agent.first)} at ${esc(D.company)} prepared this for ${esc(D.client.first)}.</p>
      <div class="price"><b>${esc(money(q.monthly))}</b><span>/ month</span></div>
      <div class="rows">
        ${q.carrier ? `<div><span>Carrier</span><b>${esc(q.carrier)}</b></div>` : ""}
        ${q.product ? `<div><span>Coverage</span><b>${esc(q.product)}</b></div>` : ""}
        ${q.summary ? `<div><span>Details</span><b>${esc(q.summary)}</b></div>` : ""}
        <div><span>Numbers</span><b>${q.exact ? "Carrier rate" : "Estimate — confirm with the carrier"}</b></div>
      </div>
      <p class="note">${esc(D.disclaimer)}</p>
      ${D.book?.on && D.book.url ? `<a class="btn wide" href="${esc(D.book.url)}">Book a call with ${esc(D.agent.first)}</a>` : ""}`;
  })();
})();
</script>
</body>
</html>
