<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Book a call · Highpoint Financial</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Libre+Caslon+Text:wght@400;700&display=swap">
<style>
:root{--bg:#f4f6fa;--card:#fff;--ink:#0f1a2e;--muted:#566176;--line:#dde3ec;--accent:#22427f;--accent-2:#2f5296;--accent-soft:#e8eef9;--ok:#1f7a3a;--bad:#b3261e;--r:14px;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#070b14;--card:#0e1524;--ink:#eef2f8;--muted:#9aa5b8;--line:#223047;--accent:#8fb0ec;--accent-2:#3a5f9f;--accent-soft:#16223a;--ok:#86c28a;--bad:#f0a08c;color-scheme:dark}}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:17px/1.55 "IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh}
[hidden]{display:none!important}
.wrap{max-width:760px;margin:0 auto;padding:28px 16px 60px}
.brand{font:700 12px/1 "IBM Plex Sans",sans-serif;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);margin:0 0 18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:24px;box-shadow:0 10px 30px -18px rgba(15,26,46,.35)}
.who{display:flex;gap:16px;align-items:center;margin-bottom:14px}
.av{flex:none;width:56px;height:56px;border-radius:50%;display:grid;place-items:center;background:var(--accent-2);color:#fff;font:700 20px "IBM Plex Sans",sans-serif;letter-spacing:.02em}
.who b{display:block;font-size:17px}.who span{color:var(--muted);font-size:15px}
h1{font:700 clamp(24px,5vw,32px)/1.2 "Libre Caslon Text",Georgia,serif;margin:0 0 10px;letter-spacing:-.005em;text-wrap:balance}
h2{font:700 19px/1.3 "IBM Plex Sans",sans-serif;margin:0 0 12px}
p{margin:0 0 12px}.muted{color:var(--muted)}
.meta{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 0}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:99px;background:var(--accent-soft);color:var(--ink);font-size:14.5px;font-weight:500}
.sec{margin-top:18px}
.tzrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:15px;color:var(--muted);margin:-2px 0 14px}
select,input,textarea{font:inherit;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:11px 12px;width:100%;min-height:48px}
select:focus,input:focus,textarea:focus,button:focus-visible,a:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 45%,transparent);outline-offset:1px;border-color:var(--accent)}
.tzrow select{width:auto;min-height:40px;padding:6px 10px;font-size:15px}
.days{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch}
.day{flex:none;scroll-snap-align:start;min-width:92px;padding:10px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;text-align:center;font:inherit}
.day b{display:block;font-size:15px}.day span{display:block;font-size:13.5px;color:var(--muted)}
.day[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
.day:disabled{opacity:.45;cursor:default}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:10px}
.slot{min-height:52px;border-radius:12px;border:1.5px solid var(--accent);background:var(--card);color:var(--accent);font:600 17px "IBM Plex Sans",sans-serif;cursor:pointer}
.slot:hover{background:var(--accent-soft)}
.empty{padding:16px;border:1.5px dashed var(--line);border-radius:12px;color:var(--muted)}
.picked{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:14px 16px;border-radius:12px;background:var(--accent-soft);margin-bottom:16px}
.picked b{font-size:17px}
.link{all:unset;cursor:pointer;color:var(--accent);font-weight:600;text-decoration:underline;text-underline-offset:3px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
label.f{display:grid;gap:6px;font-size:15px;font-weight:600}
label.f small{font-weight:400;color:var(--muted)}
.full{grid-column:1/-1}
.consent{display:flex;gap:12px;align-items:flex-start;font-size:14.5px;line-height:1.5;color:var(--muted);padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;cursor:pointer}
.consent input{width:22px;height:22px;min-height:0;flex:none;margin:2px 0 0;accent-color:var(--accent-2)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:54px;padding:12px 22px;border:0;border-radius:12px;background:var(--accent-2);color:#fff;font:700 18px "IBM Plex Sans",sans-serif;cursor:pointer;text-decoration:none}
.btn.wide{width:100%}.btn.ghost{background:transparent;color:var(--accent);border:1.5px solid var(--accent)}
.btn:disabled{opacity:.6;cursor:default}
.err{color:var(--bad);font-weight:600;font-size:15px;margin:10px 0 0}
.done{text-align:center}
.done .tick{width:64px;height:64px;border-radius:50%;margin:4px auto 14px;display:grid;place-items:center;background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.done .when{font:700 21px/1.35 "Libre Caslon Text",Georgia,serif;margin:6px 0 14px}
.acts{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:18px}
.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.foot{margin-top:18px;font-size:13px;color:var(--muted);text-align:center}
@media (max-width:560px){.card{padding:18px}.grid{grid-template-columns:1fr}.btn{width:100%}}
</style>
</head>
<body>
<div class="wrap">
  <p class="brand" id="company">Highpoint Financial</p>
  <div class="card" id="main"><p class="muted">Loading…</p></div>
  <p class="foot">Your information is only shared with your agent. <a href="/privacy.html" style="color:inherit">Privacy</a></p>
</div>
<script>
(() => {
  "use strict";
  const $ = (s, r = document) => r.querySelector(s);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const qs = new URLSearchParams(location.search);
  const slug = (location.pathname.match(/^\/book\/([a-z0-9-]+)/i)?.[1] || qs.get("u") || "").toLowerCase();
  const manage = qs.get("m");
  const ZONES = [["America/New_York", "Eastern"], ["America/Chicago", "Central"], ["America/Denver", "Mountain"], ["America/Phoenix", "Arizona"], ["America/Los_Angeles", "Pacific"], ["America/Anchorage", "Alaska"], ["Pacific/Honolulu", "Hawaii"]];
  let tz = (() => { try { return Intl.DateTimeFormat().resolvedOptions().timeZone || "America/New_York"; } catch { return "America/New_York"; } })();
  let D = null, day = null, at = null;
  const main = $("#main");
  const fmt = (t, o) => new Date(t).toLocaleString("en-US", { timeZone: tz, ...o });
  const dayOf = (t) => fmt(t, { year: "numeric", month: "2-digit", day: "2-digit" });
  const tzName = () => (ZONES.find((z) => z[0] === tz)?.[1] || tz.split("/").pop().replace(/_/g, " ")) + " Time";
  async function api(path, body) {
    const r = await fetch(path, { method: body ? "POST" : "GET", headers: body ? { "content-type": "application/json" } : {}, body: body ? JSON.stringify(body) : undefined });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw Object.assign(new Error(j.error || "Something went wrong. Please try again."), { code: j.code, status: r.status });
    return j;
  }
  const initials = (n) => String(n || "?").split(/\s+/).filter(Boolean).slice(0, 2).map((w) => w[0].toUpperCase()).join("");
  function header() {
    const a = D.agent;
    return `<div class="who"><div class="av" aria-hidden="true">${esc(initials(a.name))}</div><div><b>${esc(a.name)}</b><span>${esc(D.company)}</span></div></div>
      <h1>${esc(a.title)}</h1><p class="muted" style="margin:0">${esc(a.intro)}</p>
      <div class="meta"><span class="chip">${esc(D.length)} minutes</span><span class="chip">${esc(D.type === "Zoom" ? "Zoom call" : "Phone call")}</span><span class="chip">Free, no obligation</span></div>`;
  }
  // slots grouped by the visitor's own calendar day
  function grouped() {
    const g = new Map();
    for (const d of D.days) for (const t of d.slots) { const k = dayOf(t); if (!g.has(k)) g.set(k, []); g.get(k).push(t); }
    return [...g.entries()].map(([k, list]) => ({ k, first: list[0], list: list.sort((a, b) => a - b) }));
  }
  function pickView(msg) {
    const days = grouped();
    if (!day || !days.some((d) => d.k === day)) day = days[0]?.k || null;
    const cur = days.find((d) => d.k === day);
    const zoneOpts = [...new Map([[tz, tzName()], ...ZONES.map(([z, n]) => [z, n + " Time"])]).entries()].map(([z, n]) => `<option value="${esc(z)}" ${z === tz ? "selected" : ""}>${esc(n)}</option>`).join("");
    main.innerHTML = header() + `<div class="sec"><h2>Pick a time</h2>
      <div class="tzrow"><span>Times are in</span><select id="tz" aria-label="Time zone">${zoneOpts}</select></div>
      ${msg ? `<p class="err" role="alert">${esc(msg)}</p>` : ""}
      ${days.length ? `<div class="days" role="group" aria-label="Days">${days.map((d) => `<button class="day" type="button" data-k="${esc(d.k)}" aria-pressed="${d.k === day}"><b>${esc(fmt(d.first, { weekday: "short" }))}</b><b>${esc(fmt(d.first, { month: "short", day: "numeric" }))}</b><span>${d.list.length} open</span></button>`).join("")}</div>
        <div class="slots" role="group" aria-label="Times">${cur.list.map((t) => `<button class="slot" type="button" data-t="${t}">${esc(fmt(t, { hour: "numeric", minute: "2-digit" }))}</button>`).join("")}</div>`
      : `<div class="empty">No open times in the next couple of weeks. Please check back soon or call your agent.</div>`}</div>`;
    $("#tz").onchange = (e) => { tz = e.target.value; day = null; pickView(); };
    main.querySelectorAll(".day").forEach((b) => (b.onclick = () => { day = b.dataset.k; pickView(); main.querySelector(".slots")?.scrollIntoView({ block: "nearest", behavior: "smooth" }); }));
    main.querySelectorAll(".slot").forEach((b) => (b.onclick = () => { at = +b.dataset.t; formView(); }));
  }
  const saved = {};
  function formView(msg) {
    main.innerHTML = header() + `<div class="sec">
      <div class="picked"><div><span class="muted" style="font-size:14px">Your call</span><br><b>${esc(fmt(at, { weekday: "long", month: "long", day: "numeric" }))} at ${esc(fmt(at, { hour: "numeric", minute: "2-digit" }))}</b> <span class="muted">${esc(tzName())}</span></div><button class="link" type="button" id="chg">Change time</button></div>
      <h2>Your details</h2>
      <form id="f" novalidate>
        <div class="grid">
          <label class="f">First name<input name="first" autocomplete="given-name" required value="${esc(saved.first || "")}"></label>
          <label class="f">Last name<input name="last" autocomplete="family-name" value="${esc(saved.last || "")}"></label>
          <label class="f">Mobile phone<input name="phone" type="tel" inputmode="tel" autocomplete="tel-national" placeholder="(555) 555-0123" required value="${esc(saved.phone || "")}"></label>
          <label class="f">Email <small>optional, for your confirmation</small><input name="email" type="email" autocomplete="email" value="${esc(saved.email || "")}"></label>
          <label class="f">State<select name="state" autocomplete="address-level1"><option value="">Choose…</option>${D.states.map((s) => `<option ${saved.state === s ? "selected" : ""}>${s}</option>`).join("")}</select></label>
          <label class="f">What would you like to talk about?<select name="product">${Object.entries(D.products).map(([k, n]) => `<option value="${esc(k)}" ${saved.product === k ? "selected" : ""}>${esc(n)}</option>`).join("")}</select></label>
          <label class="f full">Anything your agent should know? <small>optional</small><textarea name="notes" rows="3" maxlength="1000">${esc(saved.notes || "")}</textarea></label>
          <label class="hp" aria-hidden="true">Website<input name="website" tabindex="-1" autocomplete="off"></label>
          <label class="consent full"><input type="checkbox" name="consent" ${saved.consent ? "checked" : ""}><span>I agree that ${esc(D.agent.name)} of ${esc(D.company)} may call and text me at the number above about this appointment and my coverage options. Message and data rates may apply. Reply STOP to opt out of texts. This isn't a condition of any purchase.</span></label>
        </div>
        ${msg ? `<p class="err" role="alert">${esc(msg)}</p>` : ""}
        <div style="margin-top:16px"><button class="btn wide" id="go" type="submit">Book my call</button></div>
      </form></div>`;
    $("#chg").onclick = () => { collect(); pickView(); };
    const collect = () => { const f = new FormData($("#f")); for (const k of ["first", "last", "phone", "email", "state", "product", "notes"]) saved[k] = String(f.get(k) || ""); saved.consent = !!f.get("consent"); return f; };
    $("#f").onsubmit = async (e) => {
      e.preventDefault(); const f = collect();
      if (!saved.first.trim()) return formView("Please add your first name.");
      if (saved.phone.replace(/\D/g, "").replace(/^1(?=\d{10}$)/, "").length !== 10) return formView("Please add a 10-digit phone number.");
      if (!saved.consent) return formView("Please check the box so your agent can call you.");
      const btn = $("#go"); btn.disabled = true; btn.textContent = "Booking…";
      try {
        const r = await api(`/api/book/p/${encodeURIComponent(slug)}`, { at, tz, ...saved, website: f.get("website") || "" });
        doneView(r);
      } catch (err) {
        if (err.code === "taken") { await load(); return pickView(err.message); }
        formView(err.message);
      }
    };
  }
  const gcal = (t, len, title) => { const s = (x) => new Date(x).toISOString().replace(/[-:]/g, "").replace(/\.\d{3}/, ""); return `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent(title)}&dates=${s(t)}/${s(t + len * 6e4)}&details=${encodeURIComponent("Your agent will call you at the number you gave.")}`; };
  const icsFile = (t, len, title) => { const s = (x) => new Date(x).toISOString().replace(/[-:]/g, "").replace(/\.\d{3}/, ""); const body = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//Highpoint Financial//Booking//EN", "BEGIN:VEVENT", `UID:${t}-${Math.random().toString(36).slice(2)}@highpoint`, `DTSTAMP:${s(Date.now())}`, `DTSTART:${s(t)}`, `DTEND:${s(t + len * 6e4)}`, `SUMMARY:${title.replace(/[,;]/g, " ")}`, "END:VEVENT", "END:VCALENDAR"].join("\r\n"); return "data:text/calendar;charset=utf-8," + encodeURIComponent(body); };
  function doneView(r) {
    const title = `Call with ${D.agent.name} (${D.company})`;
    main.innerHTML = `<div class="done"><div class="tick" aria-hidden="true"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
      <h1>You're booked</h1>
      <p class="when">${esc(fmt(r.at, { weekday: "long", month: "long", day: "numeric" }))}<br>${esc(fmt(r.at, { hour: "numeric", minute: "2-digit" }))} ${esc(tzName())}</p>
      <p class="muted">${esc(D.agent.first)} will call you at ${esc(saved.phone)}.${r.emailed ? " A confirmation is on its way to your email." : ""}</p>
      <div class="acts"><a class="btn" href="${esc(gcal(r.at, r.length, title))}" target="_blank" rel="noopener">Add to Google Calendar</a><a class="btn ghost" href="${icsFile(r.at, r.length, title)}" download="call-with-${esc(slug)}.ics">Apple or Outlook calendar</a></div>
      <p style="margin-top:18px"><a class="link" href="${esc(r.manage)}">Need to cancel?</a></p></div>`;
  }
  async function manageView() {
    let m; try { m = await api(`/api/book/m/${encodeURIComponent(manage)}`); } catch (e) { main.innerHTML = `<h1>Booking not found</h1><p class="muted">${esc(e.message)}</p>`; return; }
    D = { agent: m.agent, company: m.company }; $("#company").textContent = m.company;
    const when = `${fmt(m.at, { weekday: "long", month: "long", day: "numeric" })} at ${fmt(m.at, { hour: "numeric", minute: "2-digit" })} ${tzName()}`;
    const again = `<a class="btn" href="/book/${esc(m.slug)}">Pick a new time</a>`;
    if (m.canceled) { main.innerHTML = `<h1>This call was canceled</h1><p class="muted">${esc(when)}</p><div class="acts" style="justify-content:flex-start">${again}</div>`; return; }
    if (m.past) { main.innerHTML = `<h1>Your call with ${esc(m.agent.first)}</h1><p class="muted">This was set for ${esc(when)}.</p>`; return; }
    main.innerHTML = `<div class="who"><div class="av" aria-hidden="true">${esc(initials(m.agent.name))}</div><div><b>${esc(m.agent.name)}</b><span>${esc(m.company)}</span></div></div>
      <h1>Your call with ${esc(m.agent.first)}</h1><p class="when" style="font:700 20px/1.35 'Libre Caslon Text',Georgia,serif">${esc(when)}</p>
      <p class="muted">Can't make it? Cancel here, then pick a new time if you'd like.</p>
      <div class="acts" style="justify-content:flex-start"><button class="btn ghost" id="cx" type="button">Cancel this call</button></div><p class="err" id="cxe" hidden></p>`;
    $("#cx").onclick = async (e) => {
      const b = e.currentTarget;
      if (!b.dataset.sure) { b.dataset.sure = "1"; b.textContent = "Yes, cancel my call"; return; }
      b.disabled = true;
      try { await api(`/api/book/m/${encodeURIComponent(manage)}`, { cancel: true }); main.innerHTML = `<h1>Your call is canceled</h1><p class="muted">${esc(m.agent.first)} has been told. You can pick a new time whenever you're ready.</p><div class="acts" style="justify-content:flex-start">${again}</div>`; }
      catch (err) { $("#cxe").hidden = false; $("#cxe").textContent = err.message; b.disabled = false; }
    };
  }
  async function load() { D = await api(`/api/book/p/${encodeURIComponent(slug)}`); $("#company").textContent = D.company; document.title = `Book a call with ${D.agent.name} · ${D.company}`; }
  (async () => {
    if (manage) return manageView();
    if (!slug) { main.innerHTML = `<h1>Booking link not found</h1><p class="muted">Ask your agent for their booking link.</p>`; return; }
    try { await load(); pickView(); }
    catch (e) { main.innerHTML = `<h1>This booking link isn't available</h1><p class="muted">${esc(e.message)}</p>`; }
  })();
})();
</script>
</body>
</html>
